name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project doesn't ship a committed Gradle wrapper (gradlew/gradle-wrapper.jar),
      # so CI installs Gradle directly instead of relying on ./gradlew.
      # If you generate a wrapper locally (Android Studio does this on first open, or
      # run gradle wrapper yourself) you can switch this step to ./gradlew assembleDebug.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
